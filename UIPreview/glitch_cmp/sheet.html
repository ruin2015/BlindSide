<!doctype html>
<html><head><meta charset="utf-8"><title>Glitch Compare</title>
<style>body{margin:0;background:#111316}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// ?u=unity_kit_glitch.png&tag=before
const q = new URLSearchParams(location.search);
const unity = q.get('u') || 'unity_kit_glitch.png', tag = q.get('tag') || '';
const T = [100, 210, 350, 600], CW = 300, CH = 400, PAD = 12, LH = 24;
const ucell = [[40, 52, 256, 256], [316, 52, 256, 256], [592, 52, 256, 256], [868, 52, 256, 256]];
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s + '?v=' + Date.now(); });
(async () => {
  const mocks = await Promise.all(T.map(t => load('mock_' + t + '.png')));
  const u = await load(unity);
  const c = document.getElementById('c'), g = c.getContext('2d');
  c.width = PAD + T.length * (CW + PAD) + 90; c.height = PAD + 2 * (CH + LH + PAD) + 30;
  g.fillStyle = '#111316'; g.fillRect(0, 0, c.width, c.height);
  g.font = '600 14px monospace'; g.fillStyle = '#e8ecef';
  g.fillText('CardEnter — top: mockup (#oc, CRUSHER)   bottom: Unity KitGlitch   ' + tag, PAD, 20);
  const fit = (img, sx, sy, sw, sh, x, y) => {
    const k = Math.min(CW / sw, CH / sh), w = sw * k, h = sh * k;
    g.fillStyle = '#1c2026'; g.fillRect(x, y, CW, CH);
    g.drawImage(img, sx, sy, sw, sh, x + (CW - w) / 2, y + (CH - h) / 2, w, h);
  };
  for (let i = 0; i < T.length; i++) {
    const x = PAD + i * (CW + PAD);
    for (let row = 0; row < 2; row++) {
      const y = 30 + PAD + row * (CH + LH + PAD);
      g.fillStyle = '#9aa2aa'; g.fillText((row ? 'UNITY' : 'MOCK') + '  t=' + (T[i] / 1000).toFixed(2) + 's', x, y + 16);
      if (row === 0) fit(mocks[i], 0, 0, mocks[i].width, mocks[i].height, x, y + LH);
      else { const r = ucell[i]; fit(u, r[0], r[1], r[2], r[3], x, y + LH); }
    }
  }
  document.title = 'ready';
})();
</script></body></html>
